<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0d5c24" />
<meta name="description" content="Leroy Football — a fun swipe-to-shoot penalty shootout game." />
<title>Leroy Football</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Leroy Football" />
<style>
  :root {
    --grass-a: #2aa44a;
    --grass-b: #11762f;
    --ink: #0a2a14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #06371a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    overscroll-behavior: none;
    touch-action: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* HUD */
  #hud {
    position: fixed;
    top: env(safe-area-inset-top, 0);
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 16px;
    pointer-events: none;
    z-index: 5;
    font-variant-numeric: tabular-nums;
  }
  .pill {
    background: rgba(0,0,0,0.38);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 8px 14px;
    line-height: 1.05;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .pill .label { font-size: 10px; letter-spacing: 1.5px; opacity: .7; text-transform: uppercase; }
  .pill .value { font-size: 22px; font-weight: 800; }
  #streakPill { text-align: right; }
  #streakPill.hot .value { color: #ffd23f; text-shadow: 0 0 12px rgba(255,210,63,.8); }

  #playerPill {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0) + 16px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    font-weight: 800;
    font-size: 15px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
  }
  #playerPill.show { opacity: 1; }
  #playerDot { width: 12px; height: 12px; border-radius: 50%; background: #ff5b5b; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }

  /* Center messages */
  #toast {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%,-50%) scale(.6);
    font-size: clamp(30px, 9vw, 80px);
    font-weight: 900;
    letter-spacing: 1px;
    max-width: 96vw;
    white-space: normal;
    text-shadow: 0 6px 0 rgba(0,0,0,.25), 0 0 30px rgba(0,0,0,.4);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    text-align: center;
  }
  #toast.show { animation: pop 1.1s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.4) rotate(-6deg); }
    18%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12) rotate(2deg); }
    30%  { transform: translate(-50%,-50%) scale(1) rotate(0); }
    75%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-55%) scale(1.05); }
  }

  /* Hint */
  #hint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0) + 22px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.32);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    z-index: 5;
    pointer-events: none;
    transition: opacity .4s;
    text-align: center;
  }

  /* Overlay (start / gameover) */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(120% 90% at 50% 0%, rgba(7,70,33,.55), rgba(4,40,20,.92));
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    padding: 24px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: clamp(34px, 11vw, 72px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: .95;
    text-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  #overlay h1 .ball { display:inline-block; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlay p { font-size: 16px; max-width: 320px; opacity: .9; line-height: 1.5; }
  #overlay .stat { font-size: 15px; opacity: .85; }
  #overlay .stat b { font-size: 22px; }
  button.play {
    margin-top: 6px;
    border: none;
    background: linear-gradient(180deg, #ffe066, #ffb300);
    color: #5a3a00;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 16px 44px;
    border-radius: 999px;
    box-shadow: 0 8px 0 #b97c00, 0 14px 22px rgba(0,0,0,.3);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    touch-action: manipulation;
  }
  button.play:active { transform: translateY(5px); box-shadow: 0 3px 0 #b97c00, 0 8px 14px rgba(0,0,0,.3); }

  /* Screens within overlay */
  .screen { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 540px; }
  .screen.hidden { display: none; }
  #teamSelect h2 { font-size: clamp(26px, 8vw, 40px); font-weight: 900; letter-spacing: 1px; }
  #teamSelect .sub { font-size: 14px; opacity: .8; margin-top: -8px; }
  .team { width: 100%; }
  .teamHead {
    font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    font-size: 13px; margin: 4px 0 8px; display: flex; align-items: center; gap: 8px; justify-content: center;
  }
  .teamHead.boys { color: #fca5a5; }
  .teamHead.girls { color: #e9d5ff; }
  .teamHead .badge { font-size: 10px; background: rgba(255,255,255,.16); padding: 2px 8px; border-radius: 999px; letter-spacing: .5px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; }
  .pcard {
    background: rgba(255,255,255,.07);
    border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 16px; padding: 12px 10px;
    cursor: pointer; transition: transform .1s ease, border-color .1s, background .1s;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .pcard:hover { background: rgba(255,255,255,.12); }
  .pcard:active { transform: scale(.95); }
  .pcard .av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 20px; color: #fff; box-shadow: inset 0 -3px 6px rgba(0,0,0,.25); }
  .pcard .pname { font-weight: 800; font-size: 16px; }
  .pcard .tag { font-size: 10px; opacity: .65; letter-spacing: .3px; text-align: center; min-height: 12px; }
  .pcard .bars { width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .barRow { display: flex; align-items: center; gap: 6px; }
  .barRow span { font-size: 8px; width: 26px; opacity: .6; letter-spacing: .5px; }
  .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffe066, #ff9f43); }
  .linkBtn { background: none; border: none; color: #fff; opacity: .65; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px; }
  .mute {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0) + 60px);
    right: 16px;
    z-index: 7;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.32);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="app"><canvas id="game"></canvas></div>

  <div id="hud">
    <div class="pill" id="scorePill">
      <div class="label">Score</div>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div class="pill" id="streakPill">
      <div class="label">Streak · Best <span id="bestVal">0</span></div>
      <div class="value" id="streakVal">0</div>
    </div>
  </div>

  <div class="pill" id="playerPill"><span id="playerDot"></span><span id="playerName">Leroy</span></div>

  <button class="mute" id="muteBtn" aria-label="Toggle sound">🔊</button>
  <div id="toast"></div>
  <div id="hint">Swipe up from the ball to shoot ⚽</div>

  <div id="overlay">
    <div id="startScreen" class="screen">
      <h1><span class="ball">⚽</span> Leroy Football</h1>
      <p id="startText">Pick a striker and swipe to bend it past the keeper. You get <b>3 misses</b>. Build a streak for bonus points!</p>
      <div class="stat">Best score: <b id="hiScore">0</b></div>
      <button class="play" id="startBtn">PLAY</button>
    </div>

    <div id="teamSelect" class="screen hidden">
      <h2>Pick your striker</h2>
      <div class="sub">⭐ The girls' team is on another level…</div>
      <div class="team">
        <div class="teamHead boys">Boys</div>
        <div class="cards" id="boysCards"></div>
      </div>
      <div class="team">
        <div class="teamHead girls">Girls <span class="badge">★ STAR TEAM</span></div>
        <div class="cards" id="girlsCards"></div>
      </div>
      <button class="linkBtn" id="backBtn">← Back</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
